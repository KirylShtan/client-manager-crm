services:
  mysqlServer:
    image: mysql:8.1
    container_name: mysqlServer-production
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyAdmin-production
    restart: unless-stopped
    environment:
      PMA_HOST: ${PMA_HOST}
      PMA_USER: ${PMA_USER}
      PMA_PASSWORD: ${PMA_PASSWORD}
    ports:
      - "127.0.0.1:8082:80"
    depends_on:
      - mysqlServer
  vault:
    image: hashicorp/vault:latest
    container_name: vault-production
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_API_ADDR: ${VAULT_API_ADDR}
      VAULT_ADDR: ${VAULT_ADDR}
      VAULT_CACERT: ${VAULT_CACERT}
    command: ["vault", "server", "-config=/vault/config/vault-production.hcl"]
    volumes:
      - vault-data:/vault/file
      - ./vault_config:/vault/config:ro
      - ./vault_config/tls:/vault/tls:ro

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-production
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqlServer:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQL8Dialect
      SPRING_CLOUD_VAULT_URI: https://vault:8200
      SPRING_CLOUD_VAULT_TOKEN: ${SPRING_CLOUD_VAULT_TOKEN}
      SPRING_CLOUD_VAULT_CONNECTION_TIMEOUT: 5000
      SPRING_CLOUD_VAULT_READ_TIMEOUT: 5000
      SPRING_CLOUD_VAULT_RETRY_MAX_ATTEMPTS: 5
      SPRING_CLOUD_VAULT_RETRY_INITIAL_INTERVAL: 2000
      SECURITY_USER_PASSWORD: ${SECURITY_USER_PASSWORD}
      SECURITY_USER_NAME: ${SECURITY_USER_NAME}
      SECURITY_USER_NAME_1: ${SECURITY_USER_NAME_1}
      SECURITY_USER_PASSWORD_1: ${SECURITY_USER_PASSWORD_1}
      SECURITY_USER_NAME_2: ${SECURITY_USER_NAME_2}
      SECURITY_USER_PASSWORD_2: ${SECURITY_USER_PASSWORD_2}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      VAULT_SECRET_TOKEN: ${VAULT_SECRET_TOKEN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    depends_on:
      mysqlServer:
        condition: service_healthy
      vault:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql-data:
    name: clientmanagercrm_mysql-data-prod
  vault-data:
    name: clientmanagercrm_vault-data-prod
