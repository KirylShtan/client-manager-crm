spring.datasource.url=jdbc:mysql://localhost:3306/natadataserviceapp?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
server.port=8080
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
spring.main.allow-circular-references = true
spring.jpa.open-in-view= true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.mail.properties.mail.debug=true
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
telegram.chat.id = 1626749962
telegram.bot.token = ${TELEGRAM_BOT_TOKEN}
spring.cloud.vault.uri=https://vault:8200
spring.cloud.vault.ssl.trust-store=classpath:vault-truststore.jks
spring.cloud.vault.ssl.trust-store-password=${VAULT_SSL_TRUSTSTORE_PASSWORD:vaultdev}
spring.cloud.vault.ssl.trust-store-type=JKS
spring.cloud.vault.token=${VAULT_SECRET_TOKEN}
spring.cloud.vault.kv.enabled=true
spring.cloud.vault.kv.backend=secret
spring.cloud.vault.kv.default-context=application
spring.cloud.vault.kv.profile-separator=/
telegram.webhook.secret=${TELEGRAM_WEBHOOK_SECRET}
